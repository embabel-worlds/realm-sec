- name: SecRegistrant
  userAnchor: false
  description: >-
    A company as the SEC knows it, keyed on CIK. Reached by TICKER or by CIK, never by name:
    EDGAR indexes 8,000+ registrants by name, and fuzzy-matching a domain-keyed corpus against
    them attributes a bank's filings to a tobacco company. `ticker` is the safe bridge because it
    is unique and machine-assigned; a company NAME is neither.
    `domain` is recorded when a caller supplied one, and it is the CALLER'S claim, not the SEC's —
    EDGAR has no website field. Whoever set it is responsible for it being right.
  properties:
    cik: { metadata: { identity: "true" } }
    ticker: "Exchange ticker used to resolve this registrant. The bridge that made the join safe."
    name: "Registrant name as the SEC records it."
    sicDescription: "SEC industry classification — a regulator's view, unlike a vendor's industry label."
    exchange: "Primary exchange."
    domain: >-
      The web domain a caller asserted this registrant owns, so ESG observations keyed on domain can
      join. NOT from the SEC. Only ever set from a verified identity resolution.
    resolvedAt: "When the registrant was resolved."

- name: SecFiling
  userAnchor: false
  description: >-
    One filing in a registrant's EDGAR index — form type, date, accession number and the URL of its
    primary document. A ROW IN AN INDEX, not the content: the disclosure itself is ingested as a
    Document and read like any other source, so a figure taken from a 10-K carries the same
    verbatim-quote provenance as one taken from a web page.
  properties:
    accessionNumber: { metadata: { identity: "true" } }
    cik: "FK to the SecRegistrant that filed it."
    form: "Form type — 10-K, 20-F, 8-K, DEF 14A. A 10-K carries the climate and risk discussion."
    filingDate: "Date filed, ISO-8601."
    primaryDocumentUrl: "Absolute URL of the filing's primary document, ready to ingest."
    ingested: { type: boolean, description: "Whether the document has been pulled into the corpus." }
